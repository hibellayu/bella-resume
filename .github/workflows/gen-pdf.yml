name: Generate PDF

on:
  push:
    paths:
      - 'zh/index.html'
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  pdf:
    runs-on: ubuntu-latest
    if: "!contains(github.event.head_commit.message, 'chore: update PDF')"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install

      - name: Install Chrome for Puppeteer
        run: npx puppeteer browsers install chrome

      - name: Generate PDF
        run: node scripts/gen-pdf.js

      - name: Commit PDF
        run: |
          git config user.name "Bella Resume Bot"
          git config user.email "actions@github.com"
          git config core.quotepath false
          git add "assets/黃于芹_履歷_2026.pdf"
          git diff --staged --quiet || git commit -m "chore: update PDF $(TZ=Asia/Taipei date '+%Y-%m-%d %H:%M')"
          git push
