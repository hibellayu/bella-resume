<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>黃于芹 Bella Huang — 履歷檔案下載</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: "PingFang TC", "Noto Sans TC", "Microsoft JhengHei", sans-serif;
    font-size: 13px;
    line-height: 1.65;
    color: #1a1a1a;
    background: #fff;
    max-width: 780px;
    margin: 0 auto;
    padding: 52px 56px;
  }

  .back-link {
    display: inline-block; font-size: 11.5px; color: #999;
    text-decoration: none; margin-bottom: 32px; transition: color 0.2s;
  }
  .back-link:hover { color: #333; }

  .page-header {
    border-bottom: 2px solid #111;
    padding-bottom: 14px;
    margin-bottom: 28px;
  }

  h1 {
    font-size: 20px; font-weight: 700; color: #111; margin-bottom: 6px;
  }

  .page-desc {
    font-size: 12.5px; color: #888; line-height: 1.7;
  }

  .file-list { list-style: none; }

  .file-item {
    display: flex;
    align-items: center;
    gap: 16px;
    padding: 20px 0;
    border-bottom: 1px solid #f0f0f0;
  }

  .file-item:last-child { border-bottom: none; }

  .file-icon {
    width: 40px; height: 40px;
    border-radius: 6px;
    display: flex; align-items: center; justify-content: center;
    font-size: 18px; flex-shrink: 0;
  }

  .icon-pdf { background: #fff0f0; }

  .file-info { flex: 1; }

  .file-name {
    font-size: 13.5px; font-weight: 600; color: #111; margin-bottom: 3px;
  }

  .file-meta { font-size: 11.5px; color: #888; }
  .file-updated { font-size: 11px; color: #bbb; margin-top: 3px; letter-spacing: 0.3px; }

  .file-btn {
    display: inline-block;
    font-size: 11.5px; font-weight: 600;
    color: #111; text-decoration: none;
    border: 1px solid #ddd; padding: 6px 16px; border-radius: 4px;
    transition: background 0.15s, border-color 0.15s;
    white-space: nowrap;
  }

  .file-btn:hover { background: #111; color: #fff; border-color: #111; }

  @media (max-width: 600px) {
    body { padding: 24px 20px; }
    .file-item { flex-wrap: wrap; gap: 12px; }
    .file-info { flex: 1 1 calc(100% - 52px); }
    .file-btn { width: 100%; text-align: center; margin-top: 4px; }
  }
</style>
</head>
<body>

<a class="back-link" href="../">← 返回</a>

<div class="page-header">
  <h1>履歷檔案下載</h1>
  <div class="page-desc">提供 PDF 履歷版本下載，適用於職缺投遞、獵頭分享與正式申請使用。</div>
</div>

<ul class="file-list">
  <li class="file-item">
    <div class="file-icon icon-pdf">📄</div>
    <div class="file-info">
      <div class="file-name">黃于芹_BellaHuang_Resume_2026.pdf</div>
      <div class="file-meta">中文版｜適用台灣品牌端、整合行銷與策略相關職位</div>
      <div class="file-updated" id="pdf-zh-updated">載入中⋯</div>
    </div>
    <a class="file-btn" href="../assets/黃于芹_履歷_2026.pdf" download="黃于芹_BellaHuang_Resume_2026.pdf">Download PDF</a>
  </li>
</ul>

<script>
(function () {
  var files = [
    { id: 'pdf-zh-updated', path: 'assets/%E9%BB%83%E4%BA%8E%E8%8A%B9_%E5%B1%A5%E6%AD%B7_2026.pdf' },
  ];
  files.forEach(function (f) {
    fetch('https://api.github.com/repos/hibellayu/bella-resume/commits?path=' + f.path + '&per_page=1')
      .then(function (r) { return r.json(); })
      .then(function (data) {
        if (!data || !data[0]) return;
        var d = new Date(data[0].commit.author.date);
        var parts = new Intl.DateTimeFormat('en', {
          timeZone: 'Asia/Taipei',
          year: 'numeric', month: '2-digit', day: '2-digit',
          hour: '2-digit', minute: '2-digit', hour12: false
        }).formatToParts(d);
        var p = {};
        parts.forEach(function (x) { p[x.type] = x.value; });
        var ts = p.year + '.' + p.month + '.' + p.day + ' ' + p.hour + ':' + p.minute;
        var el = document.getElementById(f.id);
        if (el) el.textContent = 'Updated｜' + ts;
      })
      .catch(function () {
        var el = document.getElementById(f.id);
        if (el) el.textContent = '';
      });
  });
})();
</script>
</body>
</html>
